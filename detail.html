<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

body{
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    text-align: center;
}


.container{

    width: 400px;
    margin: 50px auto;
    background-color: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px gray;

}


h1{
    color: blue;
}


#productImage{

    width: 200px;
    height: 200px;

}


#productName{

    color: green;
    font-size: 25px;

}


#productDescription{

    font-size: 18px;
    color: black;

}


#productPrice{

    font-size: 20px;
    color: red;
    font-weight: bold;

}


button{

    background-color: blue;
    color: white;
    padding: 10px 20px;
    margin: 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;

}
ul{
    list-style: none;

}



button:hover{

    background-color: darkblue;

}

</style>
</head>
<body>
    <div class="container">

    <h1 id="productTitle"></h1>

    <img id="productImage">

    <h2 id="productName"></h2>

    <p id="productDescription"></p>

    <h3>Features</h3>

    <ul>
        <li id="productPrice"></li>
    </ul>

    <button id="btn1">Add to Cart</button>

    <button id="btn2">Buy Now</button>

</div>
    <script src="./details.js"></script>
</body>
</html>
